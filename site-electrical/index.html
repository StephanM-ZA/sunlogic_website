<title>Sunlogic Electrical</title>
<meta name="description" content="Sunlogic Electrical. Certified electrical contracting."/>
<link rel="icon" type="image/png" href="images/fav_icon.png"/>
<link rel="preload" href="shared/fonts/HankenGrotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin/>

<style>
  .sl-holding { min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--color-navy); color: var(--text-inverse); padding: 48px var(--gutter); position: relative; overflow: hidden; }
  .sl-holding__grad { position: absolute; inset: 0; background: var(--gradient-dawn);
    background-size: 300% 100%; animation: daylight-gradient-drift 14s linear infinite; opacity: .5; mix-blend-mode: overlay; }
  .sl-holding__inner { position: relative; display: grid; gap: 20px; justify-items: center; text-align: center; max-width: 560px; }
  .sl-holding__logo { width: 96px; height: auto; }
</style>
</head>
<body>
<main class="sl-holding">
  <div class="sl-holding__grad"></div>
  <div class="sl-holding__inner">
    <img class="sl-holding__logo" src="images/sl_logo_verticle.svg" alt="Sunlogic" width="96" height="75"/>
    <p class="sl-eyebrow sl-eyebrow--inverse">Sunlogic Electrical</p>
    <h1 class="sl-section-heading" style="color:#fff">Electrical work, done properly and <em>certified</em></h1>
    <p class="sl-body sl-body--lg" style="color:rgba(255,255,255,.78)">This site is being built. In the meantime, everything is on the main Sunlogic site.</p>
    <a class="sl-btn sl-btn--emphasis" href="https://sunlogic.co.za">Go to sunlogic.co.za</a>
  </div>
</main>
</body>
