name = "sunlogic-leads-relay"
main = "src/index.js"
compatibility_date = "2026-08-31"

[vars]
# 1440 = 24 hours. Set to 2 for a staging run of the timing paths; putting
# it back is the last step of that run.
OFFER_TTL_MINUTES = "1440"
CLAIM_BASE_URL = "https://leads.sunlogic.co.za"
# MAIL_REDIRECT_TO is deliberately ABSENT here. It was set 2026-09-04 while
# Xneelo mail was down and removed 2026-09-10 to start the real rotation.
# Setting it in production means one address is told everything while the
# rotation appears to work and neither director hears about a lead, so it
# belongs to staging only. The TEST MODE banner on every email and the
# digest's redirect notice are both conditional on this variable and
# disappear with it; see mailer.mjs and sendDailyDigest.
N8N_WEBHOOK_URL = "https://hooks.digitaloperations.co.za/webhook/sunlogic-leads"

# Secrets are NOT here — RELAY_SECRET, RESEND_API_KEY and
# RESEND_WEBHOOK_SECRET are all set with `wrangler secret put`.
#
# RESEND_WEBHOOK_SECRET is Svix's signing secret (whsec_…), shown once when
# the endpoint is created in the Resend dashboard against
# https://leads.sunlogic.co.za/resend/webhook for email.delivered,
# email.bounced and email.complained.
#
# Without it the endpoint answers 503 and records nothing. That is deliberate
# and is the opposite of the bug it exists to fix: a handler that accepted
# every payload and quietly stored none would look perfectly healthy from
# Resend's dashboard. See src/webhook.mjs.

[[d1_databases]]
binding = "DB"
database_name = "sunlogic-leads"
database_id = "3a7d8834-4e84-4fa0-9377-f2b3da573be6"

# Brief photos. The bucket stays PRIVATE: /uploads/<key> serves objects back
# through this Worker, so there is no public bucket domain and no DNS record to
# keep. See src/uploads.mjs for why, and docs/project-brief.md for the
# `wrangler r2 bucket create` this expects to already have been run.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "sunlogic-brief-uploads"

[triggers]
# */5 sweeps expiries and retries the relay queue.
# 0 5 UTC is 07:00 in Cape Town — the digest, every morning, whether or not
# anything is wrong. See sendDailyDigest.
crons = ["*/5 * * * *", "0 5 * * *"]

# The email templates are imported as text and bundled into the Worker, so
# there is exactly one copy of each and it lives in emails/ where it can be
# reviewed. Workers cannot read files at runtime; without this rule the
# imports in src/mailer.mjs fail at build.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# --- staging -------------------------------------------------------------
# A separate Worker and a separate database, so the timing paths can be
# exercised with a 2-minute expiry without a real lead ever being subject to
# it. Production is never run with a shortened TTL; that is the entire reason
# this environment exists.
[env.staging]
name = "sunlogic-leads-relay-staging"

[env.staging.vars]
OFFER_TTL_MINUTES = "2"
# Prefixes Lead ID in the sheet so staging can never overwrite a real
# lead's row. Production deliberately has no label.
ENV_LABEL = "staging"
# Staging delivers everything here, so a test run never reaches Craig.
# Production deliberately does not set this — see mailer.mjs.
MAIL_REDIRECT_TO = "smarais.za@gmail.com"
CLAIM_BASE_URL = "https://sunlogic-leads-relay-staging.smarais-za.workers.dev"
N8N_WEBHOOK_URL = "https://hooks.digitaloperations.co.za/webhook/sunlogic-leads"

# One cron on staging, not two. The account is on the Workers Free plan,
# which caps cron triggers at five ACROSS the account — production's two
# plus staging's two plus the deadman's two does not fit, and the deploy
# that discovers this succeeds at uploading the code while silently
# failing to schedule anything. Staging has no use for a daily digest.
[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "sunlogic-leads-staging"
database_id = "9251e67a-9ae5-4d3f-9b89-3aeed2a75e7a"

# A separate bucket, for the same reason as the separate database: a staging
# run must not leave objects in the bucket a real brief's Trello card links to.
[[env.staging.r2_buckets]]
binding = "UPLOADS"
bucket_name = "sunlogic-brief-uploads-staging"

[[env.staging.rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true
