<style>body{margin:0;background:#FFF7E9}</style>
<!-- Bump every ?v= below whenever you edit one of these files. There is no
     build step, so nothing fingerprints them, and a cached copy means you
     edit a deck with old code and get no error to show for it. The panel
     prints its own version in the bar for the same reason. -->
<script src="deck-assets.js?v=2"></script>   <!-- the deck's own fonts and icons -->
<script src="brand.sunlogic.js?v=2"></script>
<script src="deck-style.js?v=2"></script>
<script src="deck-render.js?v=2"></script>
<script src="deck.data.js?v=2"></script>
<script src="deck-editor.js?v=2" defer></script>
</head>
<body>
<!-- storage-key namespaces the autosave. One key per deck, or two tabs
     overwrite each other. -->
<plugin-pitch-deck storage-key="sl-deck-current"></plugin-pitch-deck>
</body>
