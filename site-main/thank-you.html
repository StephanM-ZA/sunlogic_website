<dl-section bg="page">
  <dl-reveal>
    <dl-stack level="hero" eyebrow="Message received"
      heading="Thank You. We Have |Your Details"
      body="Someone will be in touch to arrange a time that suits you. If it is urgent, phoning is faster than waiting for a reply.">
      <dl-actions>
        <dl-roll item-class="sl-btn sl-btn--emphasis" items='[{"text":"+27 (82) 655 5371","href":"tel:+27826555371","icon":"phone"},{"text":"+27 (82) 443 7799","href":"tel:+27824437799","icon":"phone"}]'></dl-roll>
        <dl-button variant="outline" href="index.html">Back to the Site</dl-button>
      </dl-actions>
      <!-- Returns the visitor to the page they enquired from. Cancels on
           any interaction — see DlReturn in shared/components.js. -->
      <dl-return seconds="5" href="index.html"></dl-return>
    </dl-stack>
  </dl-reveal>
</dl-section>

<dl-section bg="alt">
  <dl-reveal>
    <dl-stack eyebrow="What happens next" heading="Three Steps, |From Here"></dl-stack>
  </dl-reveal>
  <dl-reveal>
    <dl-grid cols="3">
      <dl-step step="01" heading="We Call You Back"
        body="Within 24 hours, to understand what you need and arrange a time."></dl-step>
      <dl-step step="02" heading="We Come and Look"
        body="A proper site visit: your roof, your board, and your recent bills."></dl-step>
      <dl-step step="03" heading="You Get a Straight Answer" tone="inverse"
        body="What it would take, what it would cost, and what it would save. If it is not worth doing yet, we will say so."></dl-step>
    </dl-grid>
  </dl-reveal>
</dl-section>

     to call them off to another site, which is the opposite of what a thank-you
