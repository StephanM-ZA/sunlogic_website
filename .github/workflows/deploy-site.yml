name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    # This workflow publishes dist/main, the apex, so it watches the apex's own
    # source plus everything dist/main is built from. shared/ and
    # sites.config.js are in the list because the build copies shared/ into
    # every site and reads the nav, footer and logo config from that file: a
    # change to either alters the published output without site-main/ being
    # touched at all. site-energy/ and site-electrical/ are deliberately absent
    # — those two deploy through Cloudflare Pages, not here.
    paths:
      - 'site-main/**'
      - 'shared/**'
      - 'sites.config.js'
      - 'scripts/build-site.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the main site (dist/main)
        run: npm run build:main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/main

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
