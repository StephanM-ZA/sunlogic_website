name: Deploy Website to GitHub Pages

on:
  push:
    branches: [main]
    # This workflow publishes dist/main, the apex, so it watches the apex's own
    # source plus everything dist/main is built from. shared/ and
    # sites.config.js are in the list because the build copies shared/ into
    # every site and reads the nav, footer and logo config from that file: a
    # change to either alters the published output without site-main/ being
    # touched at all. site-energy/ and site-electrical/ are deliberately absent
    # — those two deploy through Cloudflare Pages, not here.
    paths:
      - 'site-main/**'
      - 'shared/**'
      - 'sites.config.js'
      - 'scripts/build-site.js'
      - 'scripts/conformance.js'
      - 'scripts/site-pages.js'
      - 'scripts/lighthouse.js'
      # The gate's own machinery. A change to the sweep, to the server both it
      # and conformance run on, or to the Lighthouse budgets alters what
      # passes, so each has to be able to trigger the workflow that enforces
      # it. lighthouserc.js was missing here until 2026-09-04: the commit that
      # fixed Lighthouse's Chrome launch could not trigger the workflow whose
      # only failing step was Lighthouse.
      - 'scripts/layout-sweep.js'
      - 'scripts/static-server.js'
      - 'lighthouserc.js'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # playwright has no install script, and the runner image ships no
      # browser. Without this every step that opens a page fails at launch.
      - name: Install Chromium for the gate
        run: npx --no-install playwright install --with-deps chromium

      # The gate. A design-system violation or a Lighthouse budget breach stops
      # the deploy here rather than being reported after the fact. Runs against
      # a full build of all three sites, because shared/ is copied into each and
      # a change there can break a site whose own source was untouched.
      - name: Build all sites for checking
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Design-system conformance
        run: npm run conformance

      # The other half of the gate. Conformance answers "is this in the
      # system?" — palette, type, case, band rhythm. It says nothing about
      # whether the page holds together, and a heading can be perfectly
      # on-palette while sitting on top of the logo. This opens every page at
      # every breakpoint the stylesheet declares, both sides of each boundary,
      # and fails on overflow, overlap, clipping or collapse. It found a
      # horizontal scroll on two home pages that had been shipping for weeks.
      - name: Layout sweep
        run: npm run sweep

      - name: Lighthouse budgets
        run: node scripts/lighthouse.js

      # Rebuilds dist/main on its own so the artifact that uploads is produced by
      # a single explicit step. Same environment as the gate's build above, so the
      # output is identical — this is for clarity about what ships, not a fix-up.
      - name: Build the main site (dist/main)
        run: npm run build:main

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/main

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
