name: Lighthouse CI

on:
  push:
    branches: [main]
    # Same set the deploy workflow watches: anything that changes what gets
    # published is worth re-measuring.
    paths:
      - 'site-main/**'
      - 'shared/**'
      - 'sites.config.js'
      - 'scripts/build-site.js'
      - 'lighthouserc.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lighthouse-ci.yml'
  workflow_dispatch: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Design-system conformance
        run: npm run build && npm run conformance

      # Runs against the built dist/ directory served locally, not the
      # live site — this never depends on DNS/domain state. Pages come from
      # scripts/site-pages.js, so a new page or a fourth site is covered on
      # its first push. Wrapped by scripts/lighthouse.js, which refuses to
      # report a pass unless the output says how many URLs were asserted
      # against — this job once passed green for weeks while auditing zero
      # pages.
      - name: Run Lighthouse CI
        run: npm run lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 30
