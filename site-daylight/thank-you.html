<!DOCTYPE html>
<html lang="en">
<head>

<title>Thank You | Sunlogic SA</title>
<link rel="stylesheet" href="shared/sunlogic.css?v=1"/>

<body>
<dl-nav-bar></dl-nav-bar>

<dl-section bg="page">
  <dl-reveal>
    <dl-stack level="hero" eyebrow="Message received"
      heading="Thank You. We Have |Your Details"
      body="Someone will be in touch to arrange a time that suits you. If it is urgent, phoning is faster than waiting for a reply.">
      <dl-actions>
        <dl-button variant="emphasis" icon="phone" href="tel:+27826555371">(082) 655-5371</dl-button>
        <dl-button variant="outline" href="index.html">Back to the Site</dl-button>
      </dl-actions>
    </dl-stack>
  </dl-reveal>
</dl-section>

<dl-section bg="alt">
  <dl-reveal>
    <dl-stack eyebrow="What happens next" heading="Three Steps, |From Here"></dl-stack>
  </dl-reveal>
  <dl-reveal>
    <dl-grid cols="3">
      <dl-step step="01" heading="We Call You Back"
        body="To understand what you need and arrange a time. [Response time — placeholder pending.]"></dl-step>
      <dl-step step="02" heading="We Come and Look"
        body="A proper site visit — your roof, your board, and your recent bills."></dl-step>
      <dl-step step="03" heading="You Get a Straight Answer" tone="inverse"
        body="What it would take, what it would cost, and what it would save. If it is not worth doing yet, we will say so."></dl-step>
    </dl-grid>
  </dl-reveal>
</dl-section>

<!-- Reading, rather than a dead end. -->
<dl-section bg="page">
  <dl-reveal>
    <dl-stack eyebrow="While you wait" heading="Worth |Knowing"
      body="Straight answers on what solar costs and what changed on your bill.">
      <dl-button variant="outline" href="blog.html">Read All Posts</dl-button>
    </dl-stack>
  </dl-reveal>
  <dl-reveal>
    <dl-grid cols="3">
      <dl-card heading="Why Your Bill Went Up"
        body="Even though you used less. The fixed monthly charge has been rising faster than the rate per unit."></dl-card>
      <dl-card heading="Should You Get a Battery?"
        body="The simple way to work it out, without being sold one."></dl-card>
      <dl-card heading="How to Read a Solar Quote"
        body="Which rate a proposal values your solar at, and why that one choice changes everything."></dl-card>
    </dl-grid>
  </dl-reveal>
</dl-section>

<dl-footer></dl-footer>
<dl-dock></dl-dock>
</body>
</html>
