<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tell Us What You Need | Sunlogic SA, Cape Town</title>
<link rel="icon" type="image/png" href="images/fav_icon.png"/>
<link rel="stylesheet" href="shared/sunlogic.css?v=18"/>
<script src="shared/icons.js?v=2" defer></script>
<script src="shared/components.js?v=26" defer></script>
<script src="shared/forms.js?v=2" defer></script>
<script src="shared/sunlogic-check.js?v=3" defer></script>
</head>
<body>
<dl-nav-bar active="contact"></dl-nav-bar>

<dl-section bg="page">
  <dl-reveal>
    <dl-stack level="hero" eyebrow="Contact"
      heading="Tell Us |What You Need"
      body="A site visit costs nothing and ends with a straight answer. Send us a message, or phone if it's urgent."></dl-stack>
  </dl-reveal>
</dl-section>

<dl-section bg="alt" id="get-in-touch">
  <dl-grid cols="split">

    <dl-reveal>
      <dl-card>
        <div class="sl-card__stack">
          <h2 class="sl-title">Send Us Your Details</h2>
          <p class="sl-body">We'll be in touch as soon as we can.</p>
        </div>
        <form data-dl-form data-webhook="PENDING_BACKEND" class="sl-form">
          <dl-field label="Name" name="name" required></dl-field>
          <dl-field label="Email address" name="email" type="email" required></dl-field>
          <dl-field label="Phone number" name="phone" type="tel" required></dl-field>
          <!-- Suburb lets you sort by service area straight away. -->
          <dl-field label="Suburb" name="suburb" required></dl-field>
          <dl-field label="What you need" name="need" required placeholder="Select an option"
            options="Solar|Electrical|Energy management|Not sure yet"></dl-field>
          <dl-field label="Property type" name="property-type" required placeholder="Select an option"
            options="Home|Small business|Larger site"></dl-field>
          <div class="sl-field">
            <label class="sl-label" for="sl-message">Message</label>
            <textarea class="sl-input sl-textarea" id="sl-message" name="message" rows="4" required
              placeholder="Tell us about your property and what you need"></textarea>
          </div>
          <label for="sl-website" style="position:absolute;left:-9999px">Website</label>
          <input id="sl-website" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"/>
          <dl-button variant="emphasis" icon="arrow-right" type="submit" full>Send Message</dl-button>
        </form>
      </dl-card>
    </dl-reveal>

    <dl-reveal>
      <div style="display:grid;gap:20px;align-content:start">
        <dl-card>
          <div class="sl-card__stack">
            <h2 class="sl-title">Contact Details</h2>
          </div>
          <div style="display:grid;gap:16px">
            <dl-contact-row icon="phone" label="Office" items='[{"text":"+27 (82) 655 5371","href":"tel:+27826555371"},{"text":"+27 (82) 443 7799","href":"tel:+27824437799"}]'></dl-contact-row>
            <dl-contact-row icon="envelope" label="Sales" value="sales@sunlogic.co.za" href="mailto:sales@sunlogic.co.za"></dl-contact-row>
            <dl-contact-row icon="lifebuoy" label="Support" value="support@sunlogic.co.za" href="mailto:support@sunlogic.co.za"></dl-contact-row>
            <dl-contact-row icon="map-pin" label="Address" value="9 Chesham Road, Claremont, Cape Town, 7708"></dl-contact-row>
            <dl-contact-row icon="clock" label="Hours" value="08:00 – 18:00, weekdays"></dl-contact-row>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:16px;padding-top:20px;border-top:1px solid var(--border-hairline)">
            <a class="sl-quicklink" href="https://www.linkedin.com/company/sunlogic-sa" target="_blank" rel="noopener"><dl-icon name="linkedin" size="18"></dl-icon>LinkedIn</a>
            <a class="sl-quicklink" href="https://www.facebook.com/sunlogicsa" target="_blank" rel="noopener"><dl-icon name="facebook" size="18"></dl-icon>Facebook</a>
            <a class="sl-quicklink" href="https://www.instagram.com/sunlogic_sa" target="_blank" rel="noopener"><dl-icon name="instagram" size="18"></dl-icon>Instagram</a>
          </div>
        </dl-card>

        <div style="border-radius:var(--radius-md);overflow:hidden;height:300px;border:1px solid var(--border-warm)">
          <iframe style="width:100%;height:100%;border:0" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps?q=9+Chesham+Road,+Claremont,+Cape+Town,+7708&output=embed"
            title="Sunlogic workshop location"></iframe>
        </div>
      </div>
    </dl-reveal>

  </dl-grid>
</dl-section>

<dl-reveal>
  <dl-statement eyebrow="What happens next"
    text="We come out, look at the property, and give you |a number we can stand behind">
    <p class="sl-body sl-body--lg" style="max-width:640px">If solar isn't worth it for your property yet, we'll tell you that instead. [Response time — placeholder pending.]</p>
  </dl-statement>
</dl-reveal>

<dl-section bg="page" id="meet-the-team">
  <dl-reveal>
    <dl-stack eyebrow="Meet the team"
      heading="The People Who Will Be |at Your Property"
      body="Not a call centre. The person who quotes the job is usually the one you see again — backed by our in-house install team."></dl-stack>
  </dl-reveal>
  <dl-reveal>
    <dl-grid cols="3">
      <dl-person photo="images/team/stephan_marais2b.jpg" name="Stephan Marais" role="Co-Owner" bio="Runs projects end to end, from the first site visit to the final sign-off." email="stephan@sunlogic.co.za"></dl-person>
      <dl-person initials="CL" name="Craig Lewis" role="Co-Owner" bio="Handles quoting and installs, and stays the point of contact afterwards." email="craig@sunlogic.co.za"></dl-person>
      <dl-person initials="AC" name="Accounts" role="For any accounting queries" bio="Invoices, payments and account statements." email="accounts@sunlogic.co.za"></dl-person>
    </dl-grid>
  </dl-reveal>
</dl-section>

<dl-footer></dl-footer>
<dl-dock></dl-dock>
</body>
</html>
