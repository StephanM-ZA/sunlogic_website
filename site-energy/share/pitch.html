<script>/* ============================================================
   SUNLOGIC DECK BRAND
   The swappable part. Colour, type and the mark live here and
   nowhere else, so a second business becomes a second file of
   this shape rather than an edit to the renderer.

   Tokens are the same names doc-builder uses, lifted from
   doc-style.css, so a deck and a proposal cannot drift apart.
   ============================================================ */
(function () {

  function assets() { return window.SL_DECK_ASSETS || {}; }

  function lockup(key) {
    var src = assets()[key];
    return src ? '<img class="sl-mark" src="' + src + '" alt="Sunlogic Energy">' : '';
  }

  window.SL_DECK_BRAND = {

  id:   'sunlogic',
  name: 'Sunlogic Energy',

  /* Rendered into :root by deck-render.js, for the screen and for
     the print document both, so there is one source of colour. */
  tokens: {
    'color-orange':      '#F66F00',
    'color-orange-text': '#B85300',
    'color-navy':        '#0D2028',
    'color-navy-deep':   '#081619',
    'color-beige':       '#FFF7E9',
    'color-beige-1':     '#F7EED9',
    'color-beige-2':     '#F0E5CF',
    'color-dark-beige':  '#DACAB6',
    'color-white':       '#fff',
    'color-grey':        '#A09B93',
    'color-grey-strong': '#5A544B',

    'surface-page':      'var(--color-beige)',
    'surface-page-alt':  'var(--color-beige-1)',
    'surface-card':      'var(--color-white)',
    'surface-sunk':      'var(--color-beige-2)',
    'surface-inverse':   'var(--color-navy)',
    'surface-highlight': '#FEEDD9',
    'border-highlight':  '#F5D6AE',
    'accent-highlight':  '#F0A050',

    'text-primary':      'var(--color-navy)',
    'text-secondary':    'var(--color-grey-strong)',
    'text-inverse':      '#fff',

    'border-hairline':   'rgba(13,32,40,.12)',
    'border-warm':       'var(--color-dark-beige)',
    'border-inverse':    'rgba(255,255,255,.18)',

    'gradient-dawn':     'linear-gradient(96deg,#4C2806 0%,#F66F00 45%,#FCCC3C 100%)',

    'font-display':      '"Hanken Grotesk","Helvetica Neue",sans-serif',
    'font-body':         '"Hanken Grotesk","Helvetica Neue",sans-serif',
    'font-mono':         '"JetBrains Mono",ui-monospace,monospace',

    'radius-sm':         '4px',
    'radius-md':         '8px',
    'radius-lg':         '16px',
    'radius-pill':       '999px'
  },

  /* The alternation. A slide that carries its own colour (cover,
     statement, cta) sits outside this and is never counted. */
  bands: ['surface-page', 'surface-page-alt'],

  /* The lockup is the site's own file, not an approximation of it. Two
     colours, because WeasyPrint does not style the inside of an SVG from
     CSS: a white lockup on a white sheet is an empty space, so it has to
     be a different file rather than a rule pointed at the same one.

     Drawn from deck-assets.js, which is generated from the built energy
     site, so the deck and the site cannot end up with different marks. */
  mark:      lockup('logo'),
  markLight: lockup('logoWhite'),

  /* The hero photograph the site opens on. The cover is the one slide
     that carries it; everything after is type on a band. */
  cover: (assets().hero || '')
  };
}());
</script>
<script>/* ============================================================
   DECK STYLES
   Held as strings rather than as .css files on purpose. A deck
   has to work from file://, from an email attachment, and fed to
   WeasyPrint on stdin, and in none of those can a script fetch a
   stylesheet beside it. doc-assets.js bakes the document CSS in
   for the same reason.

   SCREEN is fluid: a slide is a 16:9 box and everything inside it
   is sized in em off one slide font-size, so a slide is the same
   slide at any width with no JavaScript measuring anything.

   PRINT is the same markup at A4. Landscape for the deck, portrait
   for the one-pager, and the geometry is the only difference.
   ============================================================ */
window.SL_DECK_CSS = {

  /* --------------------------------------------------- shared */
  /* Everything that is about the deck rather than about the
     medium. Loaded by the screen and by print both. */
  core: [
'*,*::before,*::after{box-sizing:border-box}',
'html,body{margin:0}',
'body{background:var(--surface-page);color:var(--text-primary);',
' font-family:var(--font-body);line-height:1.45}',
'svg{display:block}',

/* ---- the slide box ---- */
'.sl-d-slide{position:relative;display:flex;flex-direction:column;overflow:hidden;',
' background:var(--band,var(--surface-page));color:var(--text-primary)}',
'.sl-d-slide--b1{--band:var(--surface-page-alt)}',
'.sl-d-slide--cover,.sl-d-slide--statement,.sl-d-slide--cta{',
' --band:var(--surface-inverse);color:var(--text-inverse)}',
'.sl-d-slide--cover .sl-d-em,.sl-d-slide--statement .sl-d-em,.sl-d-slide--cta .sl-d-em{color:var(--color-orange)}',
'.sl-d-em{font-style:normal;color:var(--color-orange-text)}',

/* ---- head stack ---- */
/* Measured off the live site: JetBrains Mono 14px, weight 600, 0.05em,
   --text-secondary on a light band and white at 70% on a dark one. */
'.sl-d-eyebrow{margin:0 0 .9em;font-family:var(--font-mono);font-size:.78em;',
' font-weight:600;letter-spacing:.05em;text-transform:uppercase;',
' color:var(--text-secondary)}',
'.sl-d-slide--cover .sl-d-eyebrow,.sl-d-slide--statement .sl-d-eyebrow,',
'.sl-d-slide--cta .sl-d-eyebrow{color:rgba(255,255,255,.7)}',
/* Section heading 48px/800, line-height 1.166, tracking -0.01em, and the
   hero 72px/900 at 1.111 and -0.02em. The site's own numbers. */
'.sl-d-h{margin:0;font-family:var(--font-display);font-size:2.66em;font-weight:800;',
' line-height:1.166;letter-spacing:-.01em;max-width:21em}',
'.sl-d-slide--cover .sl-d-h{font-size:4em;font-weight:900;line-height:1.111;',
' letter-spacing:-.02em;max-width:13em}',
'.sl-d-lead{margin:.8em 0 0;font-size:1em;line-height:1.555;',
' color:var(--text-secondary);max-width:36em}',
'.sl-d-slide--cover .sl-d-lead,.sl-d-slide--statement .sl-d-lead,',
'.sl-d-slide--cta .sl-d-lead{color:rgba(255,255,255,.78)}',
'.sl-d-slide--cover .sl-d-lead{max-width:30em}',
'.sl-d-head{flex:0 0 auto}',
'.sl-d-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;',
' min-height:0;padding-top:1.8em}',
/* A statement, a quote and the closing CTA are the whole slide, so they
   have no head above them to clear. */
'.sl-d-slide--statement .sl-d-body,.sl-d-slide--quote .sl-d-body,',
'.sl-d-slide--cta .sl-d-body{padding-top:0}',

/* ---- cover ---- */
/* The cover is navy, not the dawn gradient. The gradient IS orange, and
   the orange half of a heading laid over it cannot be read. The gradient
   earns its place as a rule above the facts instead. */
/* The site opens on a photograph with the copy held in the dark side of
   a scrim, so the deck does too. The gradient is listed first, which is
   what puts it over the image rather than under it. */
'.sl-d-slide--cover{justify-content:space-between;background-color:var(--color-navy);',
' background-image:linear-gradient(to top,rgba(13,32,40,.92) 0%,rgba(13,32,40,.45) 22%,',
' rgba(13,32,40,0) 42%),linear-gradient(100deg,rgba(13,32,40,.95) 0%,',
' rgba(13,32,40,.8) 40%,rgba(13,32,40,.3) 74%,rgba(13,32,40,.22) 100%),',
' var(--cover-photo,none);',
' background-size:cover;background-position:center}',
'.sl-d-kv{position:relative}',
'.sl-d-kv::before{content:"";position:absolute;left:0;top:-1px;width:7.5em;height:3px;',
' background:var(--gradient-dawn)}',
'.sl-d-cover-top{display:flex;align-items:flex-start;justify-content:space-between;gap:2em}',
'.sl-d-cover-mid{padding:1.2em 0}',
'.sl-d-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4em;',
' border-top:1px solid var(--border-inverse);padding-top:1.1em}',
'.sl-d-kv>div>dt{margin:0 0 .3em;font-family:var(--font-mono);font-size:.66em;',
' letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62)}',
'.sl-d-kv>div>dd{margin:0;font-size:.98em;font-weight:600;color:#fff}',

/* ---- statement ---- */

'.sl-d-statement{margin:0;font-family:var(--font-display);font-size:3.1em;font-weight:800;',
' line-height:1.1;letter-spacing:-.02em;max-width:26em}',

/* ---- cards ---- */
'.sl-d-cards{display:grid;gap:1.1em}',
'.sl-d-cards--2{grid-template-columns:repeat(2,1fr)}',
'.sl-d-cards--3{grid-template-columns:repeat(3,1fr)}',
'.sl-d-card{background:var(--surface-card);border:1px solid var(--border-hairline);',
' border-radius:var(--radius-md);padding:1.55em}',
'.sl-d-card__icon{width:1.33em;height:1.55em;margin-bottom:.9em;color:var(--color-orange)}',
'.sl-d-card h3{margin:0 0 .35em;font-family:var(--font-display);font-size:1.33em;',
' font-weight:700;line-height:1.2;letter-spacing:-.01em}',
'.sl-d-card p{margin:0;line-height:1.555;color:var(--text-secondary)}',

/* ---- label and paragraph ---- */
'.sl-d-kvlist{display:grid;grid-template-columns:repeat(2,1fr);gap:1.1em 1.8em}',
'.sl-d-kvlist>div{border-top:2px solid var(--color-orange);padding-top:.7em}',
'.sl-d-kvlist dt{margin:0 0 .3em;font-family:var(--font-display);font-size:1.02em;font-weight:700}',
'.sl-d-kvlist dd{margin:0;font-size:.92em;color:var(--text-secondary)}',

/* ---- bullets ---- */
'.sl-d-bullets{display:grid;gap:.7em 1.8em;margin:0;padding:0;list-style:none}',
'.sl-d-bullets--2{grid-template-columns:repeat(2,1fr)}',
'.sl-d-bullets li{display:flex;gap:.7em;align-items:flex-start;font-size:1em;',
' border-bottom:1px solid var(--border-hairline);padding-bottom:.7em}',
'.sl-d-bullets li::before{content:"";flex:0 0 auto;width:.46em;height:.46em;margin-top:.52em;',
' border-radius:50%;background:var(--color-orange)}',

/* ---- metrics ---- */
'.sl-d-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2em}',
'.sl-d-metric{border-top:2px solid var(--color-orange);padding-top:.8em}',
'.sl-d-metric b{display:block;font-family:var(--font-display);font-size:2.7em;',
' font-weight:900;line-height:1;letter-spacing:-.03em}',
'.sl-d-metric span{display:block;margin-top:.5em;font-size:.92em;font-weight:600}',
'.sl-d-metric em{display:block;margin-top:.25em;font-style:normal;font-size:.78em;',
' color:var(--text-secondary)}',

/* ---- quote ---- */

'.sl-d-quote{margin:0;font-family:var(--font-display);font-size:2em;font-weight:600;',
' line-height:1.26;letter-spacing:-.01em;max-width:30em}',
'.sl-d-quote::before{content:"";display:block;width:2.4em;height:3px;',
' background:var(--color-orange);margin-bottom:1em}',
'.sl-d-cite{margin:1.3em 0 0;font-size:.95em}',
'.sl-d-cite b{display:block;font-weight:700}',
'.sl-d-cite span{color:var(--text-secondary)}',

/* ---- timeline ---- */
'.sl-d-timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:1.3em}',
'.sl-d-step{position:relative;border-top:1px solid var(--border-warm);padding-top:1.1em}',
'.sl-d-step::before{content:"";position:absolute;top:-.36em;left:0;width:.72em;height:.72em;',
' border-radius:50%;background:var(--color-orange)}',
'.sl-d-step dt{margin:0 0 .45em;font-family:var(--font-mono);font-size:.7em;',
' letter-spacing:.1em;text-transform:uppercase;color:var(--color-orange-text)}',
'.sl-d-step h3{margin:0 0 .35em;font-family:var(--font-display);font-size:1.05em;font-weight:700}',
'.sl-d-step p{margin:0;font-size:.88em;color:var(--text-secondary)}',

/* ---- table ---- */
'.sl-d-table{width:100%;border-collapse:collapse;font-size:.95em}',
'.sl-d-table th{text-align:left;padding:.55em .8em;font-family:var(--font-mono);',
' font-size:.76em;font-weight:400;letter-spacing:.1em;text-transform:uppercase;',
' color:var(--text-inverse);',
' background:var(--surface-inverse)}',
'.sl-d-table th:last-child,.sl-d-table td:last-child{text-align:right;',
' font-variant-numeric:tabular-nums}',
'.sl-d-table td{padding:.62em .8em;border-bottom:1px solid var(--border-hairline);',
' background:var(--surface-card)}',
'.sl-d-table tr:nth-child(even) td{background:var(--surface-sunk)}',
'.sl-d-note{margin:1em 0 0;font-size:.85em;color:var(--text-secondary)}',

/* ---- cta ---- */

'.sl-d-actions{display:flex;flex-wrap:wrap;gap:1em;margin-top:1.8em}',
'.sl-d-action{flex:1 1 14em;background:rgba(255,255,255,.07);',
' border:1px solid var(--border-inverse);border-radius:var(--radius-md);padding:1.1em 1.3em}',
'.sl-d-action b{display:block;font-family:var(--font-display);font-size:1.1em;',
' font-weight:700;color:#fff}',
'.sl-d-action span{display:block;margin-top:.35em;font-size:.88em;color:rgba(255,255,255,.72)}',
'.sl-d-action:first-child{background:var(--color-orange);border-color:var(--color-orange)}',
'.sl-d-action:first-child span{color:rgba(255,255,255,.88)}',

/* ---- contact ---- */
'.sl-d-contact{display:grid;grid-template-columns:1.2fr 1fr;gap:2em}',
'.sl-d-contact dl{margin:0;display:grid;gap:.75em}',
'.sl-d-contact dt{font-family:var(--font-mono);font-size:.68em;letter-spacing:.12em;',
' text-transform:uppercase;color:var(--text-secondary)}',
'.sl-d-contact dd{margin:.15em 0 0;font-size:1em;font-weight:600}',
'.sl-d-who{background:var(--surface-card);border:1px solid var(--border-hairline);',
' border-radius:var(--radius-md);padding:1.3em 1.4em;align-self:start}',
'.sl-d-who b{display:block;font-family:var(--font-display);font-size:1.3em;font-weight:800}',
'.sl-d-who span{display:block;margin-top:.2em;color:var(--text-secondary);font-size:.92em}',
'.sl-d-who a{display:block;margin-top:.7em;color:var(--color-orange-text);text-decoration:none;font-weight:600}',

/* ---- slide furniture ---- */
'.sl-d-foot{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;',
' gap:1.5em;padding-top:1.4em;font-family:var(--font-mono);font-size:.68em;',
' letter-spacing:.08em;text-transform:uppercase;color:var(--color-grey-strong)}',
'.sl-d-slide--cover .sl-d-foot,.sl-d-slide--statement .sl-d-foot,',
'.sl-d-slide--cta .sl-d-foot{color:rgba(255,255,255,.55)}',
'.sl-mark{height:2.4em;width:auto;display:block}',
/* The lockup belongs on the cover. In a slide foot it is a signature,
   not a masthead, so it runs at about half. */
'.sl-d-foot .sl-mark{height:1.45em}'
  ].join('\n'),

  /* --------------------------------------------------- screen */
  screen: [
'body{padding:0 0 6rem;text-wrap:pretty}',
'.sl-d-deck{display:flex;flex-direction:column;align-items:center;gap:2rem;padding:2rem 1rem 0}',
/* A slide is a 16:9 box, and one font-size drives everything in it. */
'.sl-d-slide{width:100%;max-width:1280px;aspect-ratio:16/9;padding:3.1em 3.5em;',
' font-size:clamp(9px,1.32vw,17px);border-radius:var(--radius-lg);',
' box-shadow:0 1px 2px rgba(13,32,40,.06),0 18px 44px -24px rgba(13,32,40,.3)}',
/* Below a tablet the 16:9 box starves the copy, so let it grow. */
'@media(max-width:700px){.sl-d-slide{aspect-ratio:auto;min-height:72vw;font-size:12px}',
' .sl-d-cards--3,.sl-d-cards--2,.sl-d-kvlist,.sl-d-bullets--2,.sl-d-metrics,',
' .sl-d-timeline,.sl-d-kv,.sl-d-contact{grid-template-columns:1fr}}',

/* the bar */
'.sl-d-bar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:.75rem;',
' padding:.6rem 1rem;background:rgba(255,247,233,.86);backdrop-filter:blur(10px);',
' border-bottom:1px solid var(--border-hairline);font-family:var(--font-mono);font-size:12px}',
'.sl-d-bar .sl-mark{height:22px;margin-right:.25rem}',
'.sl-d-bar__gap{flex:1 1 auto}',
'.sl-d-btn{font:inherit;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;',
' text-transform:uppercase;padding:.5rem .85rem;border-radius:var(--radius-pill);',
' border:1px solid var(--border-hairline);background:var(--surface-card);',
' color:var(--text-primary);cursor:pointer}',
'.sl-d-btn:hover{border-color:var(--color-orange)}',
'.sl-d-btn--go{background:var(--color-orange);border-color:var(--color-orange);color:#fff}',
'.sl-d-btn[disabled]{opacity:.45;cursor:default}',
'.sl-d-count{color:var(--text-secondary)}',

/* the rail */
'.sl-d-rail{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;',
' padding:1.2rem 1rem 0;max-width:1280px;margin:0 auto}',
'.sl-d-rail button{font:inherit;font-family:var(--font-mono);font-size:11px;',
' letter-spacing:.06em;padding:.35rem .7rem;border-radius:var(--radius-pill);',
' border:1px solid var(--border-hairline);background:transparent;cursor:pointer;',
' color:var(--text-secondary)}',
'.sl-d-rail button[aria-current="true"]{background:var(--surface-inverse);',
' border-color:var(--surface-inverse);color:#fff}',

/* The section tab is for the one-pager, where a reader needs to know
   which part they are on. On screen each slide already carries the
   section name as its eyebrow, so showing it twice is just repetition. */
'.sl-d-sec{display:none}',

/* print-only furniture never shows on screen */
'.sl-d-pageno{display:none}',
'@media print{.sl-d-bar,.sl-d-rail,.sl-d-sec,.sl-d-edit{display:none!important}}'
  ].join('\n'),

  /* ---------------------------------------------------- print
     The deck at A4 landscape: one slide per page, edge to edge,
     because a slide already carries its own margin. */
  print: [
'@page{size:A4 landscape;margin:0}',
'body{background:#fff}',
'.sl-d-deck{display:block}',
'.sl-d-slide{width:297mm;height:209.7mm;padding:15mm 17mm;font-size:11.4pt;',
' break-after:page;break-inside:avoid}',
'.sl-d-slide:last-child{break-after:auto}',
'.sl-d-bar,.sl-d-rail,.sl-d-sec,.sl-d-edit{display:none}',
/* WeasyPrint lays a grid out differently from a browser, so the
   grids that matter become table rows, which it does agree about. */
/* border-spacing puts a gap before the first cell as well as between
   them, which insets every grid from the edge and leaves it out of line

   puts the first and last cells back on the margin. */
'.sl-d-cards,.sl-d-metrics,.sl-d-timeline,.sl-d-kvlist,.sl-d-kv,.sl-d-contact{',
' display:table;width:calc(100% + 18pt);margin:0 -9pt;border-spacing:9pt 0;',
' table-layout:fixed}',
'.sl-d-cards>*,.sl-d-metrics>*,.sl-d-timeline>*,.sl-d-kvlist>*,.sl-d-kv>*,',
'.sl-d-contact>*{display:table-cell;vertical-align:top}',
'.sl-d-bullets{display:block;column-count:2;column-gap:14pt}',
'.sl-d-bullets--1{column-count:1}',
'.sl-d-bullets li{break-inside:avoid}',
'.sl-d-actions{display:table;width:calc(100% + 18pt);margin:0 -9pt;border-spacing:9pt 0}',
'.sl-d-action{display:table-cell;vertical-align:top}',
'.sl-d-pageno{display:block;font-variant-numeric:tabular-nums}'
  ].join('\n'),

  /* ------------------------------------------------ one-pager
     The same slides at A4 portrait, flowing, so five sections
     land on one or two sides of paper instead of five. */
  onePager: [
'@page{size:A4 portrait;margin:12mm 12mm 14mm;',
' @bottom-center{content:counter(page) " of " counter(pages);',

<script>/* ============================================================
   SUNLOGIC DECK RENDERER
   A deck model in, markup out. No DOM, no editor, no browser API
   beyond string handling, which is why render.mjs can load this
   same file under node and the Download button and the command
   line cannot drift apart. That drift is what the LearnIQ planner
   learned the hard way: never hand-maintain a second layout.

   The model is in README.md. The short version: meta + company +
   an ordered list of sections, each holding slides, and this file
   knows how to draw each kind of slide.

   WHAT IT ENFORCES, so a deck built next year cannot drift:

   1. Band rhythm. Slide backgrounds alternate automatically, so
      no two neighbours share one. A cover, a statement and the
      closing CTA carry their own colour and sit outside it.
   2. Heading case and the em dash. checkModel() reports, never
      rewrites, because the wording is the author's.

   Copy fields are HTML on purpose: a sentence needs <strong> and
   &rsquo;. Anything landing in an attribute is escaped.
   ============================================================ */
(function () {
  'use strict';

  var root = typeof window !== 'undefined' ? window : globalThis;

  var VERSION = '1.0';
  var MODEL   = 1;               /* model version, stamped into saved files */

  /* ---------------------------------------------------------- helpers */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function raw(s) { return s == null ? '' : String(s); }
  function has(s) { return raw(s).trim() !== ''; }
  function arr(a) { return Array.isArray(a) ? a : []; }

  /* A field still carrying its bracketed placeholder is unwritten, not
     wrong. The house rules are held against finished copy only, and the
     check counts what is left instead of reporting each one as a fault. */
  function placeholder(s) { return /^\[[^\]]*\]$/.test(raw(s).trim()); }

  /* The deck's own assets, and the document builder's only as a fall
     back. A deck has to work served from its own folder, from file://
     and as one emailed file, so it reaches outside itself for nothing. */
  function assets() { return root.SL_DECK_ASSETS || root.SL_DOC_ASSETS || {}; }
  function brand()  { return root.SL_DECK_BRAND || { tokens: {}, bands: [], mark: '' }; }

  /* The lockup, in the right colour for the band it sits on. A CSS rule
     cannot do this: WeasyPrint does not style the inside of an SVG, so a
     white-on-navy mark has to be a different mark. */
  function mark(onDark) {
    var b = brand();
    return (onDark && b.markLight) ? b.markLight : (b.mark || '');
  }
  function css()    { return root.SL_DECK_CSS || {}; }

  /* Icons come from the document builder's set, so a deck and a
     proposal draw the same bolt. An unknown name falls back rather
     than rendering a hole. */
  function icon(name, cls) {
    var set = assets().icons || (root.SL_DOC_ASSETS || {}).icons || {};
    var svg = set[name] || set.bolt;
    if (!svg) return '';
    svg = svg.replace('<svg ', '<svg class="' + (cls || 'sl-d-card__icon') + '" ');
    return svg.replace(/\swidth="[^"]*"|\sheight="[^"]*"/g, '');
  }

  /* A heading is a plain part and an emphasised part. The emphasis is
     the only place orange appears in running text, so it is a field
     rather than something an author types <em> into. */
  function heading(s, tag, cls) {
    if (!has(s.h) && !has(s.em)) return '';
    return '<' + tag + ' class="' + cls + '">' + raw(s.h)
      + (has(s.em) ? (has(s.h) ? ' ' : '') + '<em class="sl-d-em">' + raw(s.em) + '</em>' : '')
      + '</' + tag + '>';
  }

  function headStack(s) {
    var out = '';
    if (has(s.eyebrow)) out += '<p class="sl-d-eyebrow">' + raw(s.eyebrow) + '</p>';
    out += heading(s, 'h2', 'sl-d-h');
    if (has(s.lead)) out += '<p class="sl-d-lead">' + raw(s.lead) + '</p>';
    return out ? '<div class="sl-d-head">' + out + '</div>' : '';
  }

  function body(inner) { return '<div class="sl-d-body">' + inner + '</div>'; }

  /* ---------------------------------------------------------- slides */

  /* Each entry takes the slide and the model and returns the inside of
     the slide box. The box itself, its band and its footer are added by
     slideHtml(), so no slide type can opt out of the rhythm. */
  var SLIDES = {

    /* The cover. Four facts at most: a fifth is a slide of its own. */
    cover: function (s, m, onWhite) {
      var meta = m.meta || {};
      var kv = arr(s.kv).slice(0, 4).map(function (r) {
        return '<div><dt>' + raw(r.k) + '</dt><dd>' + raw(r.v) + '</dd></div>';
      }).join('');
      return '<div class="sl-d-cover-top">' + mark(!onWhite)
        + (has(meta.ref) ? '<p class="sl-d-eyebrow" style="margin:0">' + raw(meta.ref) + '</p>' : '')
        + '</div>'
        + '<div class="sl-d-cover-mid">' + headStack(s) + '</div>'
        + (kv ? '<dl class="sl-d-kv">' + kv + '</dl>' : '');
    },

    /* The one dark statement. Two of them and neither means anything. */
    statement: function (s) {
      return body((has(s.eyebrow) ? '<p class="sl-d-eyebrow">' + raw(s.eyebrow) + '</p>' : '')
        + '<p class="sl-d-statement">' + raw(s.text)
        + (has(s.em) ? ' <em class="sl-d-em">' + raw(s.em) + '</em>' : '') + '</p>'
        + (has(s.body) ? '<p class="sl-d-lead">' + raw(s.body) + '</p>' : ''));
    },

    cards: function (s) {
      var cols = (Number(s.cols) === 2) ? 2 : 3;
      return headStack(s) + body('<div class="sl-d-cards sl-d-cards--' + cols + '">'
        + arr(s.items).map(function (it) {
            return '<div class="sl-d-card">' + icon(it.icon)
              + '<h3>' + raw(it.title) + '</h3><p>' + raw(it.body) + '</p></div>';
          }).join('') + '</div>');
    },

    kv: function (s) {
      return headStack(s) + body('<dl class="sl-d-kvlist">'
        + arr(s.items).map(function (it) {
            return '<div><dt>' + raw(it.k) + '</dt><dd>' + raw(it.v) + '</dd></div>';
          }).join('') + '</dl>');
    },

    bullets: function (s) {
      var cols = (Number(s.cols) === 1) ? 1 : 2;
      return headStack(s) + body('<ul class="sl-d-bullets sl-d-bullets--' + cols + '">'
        + arr(s.items).map(function (t) { return '<li><span>' + raw(t) + '</span></li>'; }).join('')
        + '</ul>');
    },

    /* Big figures. Four across, because a fifth stops being read. */
    metrics: function (s) {
      return headStack(s) + body('<div class="sl-d-metrics">'
        + arr(s.items).slice(0, 4).map(function (it) {
            return '<div class="sl-d-metric"><b>' + raw(it.v) + '</b>'
              + '<span>' + raw(it.k) + '</span>'
              + (has(it.note) ? '<em>' + raw(it.note) + '</em>' : '') + '</div>';
          }).join('') + '</div>');
    },

    quote: function (s) {
      return body('<blockquote class="sl-d-quote">' + raw(s.text) + '</blockquote>'
        + '<p class="sl-d-cite"><b>' + raw(s.cite) + '</b>'
        + (has(s.role) ? '<span>' + raw(s.role) + '</span>' : '') + '</p>');
    },

    timeline: function (s) {
      return headStack(s) + body('<dl class="sl-d-timeline">'
        + arr(s.items).map(function (it) {
            return '<div class="sl-d-step"><dt>' + raw(it.when) + '</dt>'
              + '<h3>' + raw(it.title) + '</h3><p>' + raw(it.body) + '</p></div>';
          }).join('') + '</dl>');
    },

    table: function (s) {
      var head = arr(s.head).map(function (h) { return '<th>' + raw(h) + '</th>'; }).join('');
      var rows = arr(s.rows).map(function (r) {
        return '<tr>' + arr(r).map(function (c) { return '<td>' + raw(c) + '</td>'; }).join('') + '</tr>';
      }).join('');
      return headStack(s) + body('<table class="sl-d-table">'
        + (head ? '<thead><tr>' + head + '</tr></thead>' : '')
        + '<tbody>' + rows + '</tbody></table>'
        + (has(s.note) ? '<p class="sl-d-note">' + raw(s.note) + '</p>' : ''));
    },

    /* The closing call to action. Last, and only once. */
    cta: function (s) {
      return body(headStack(s) + '<div class="sl-d-actions">'
        + arr(s.actions).slice(0, 2).map(function (a) {
            return '<div class="sl-d-action"><b>' + raw(a.label) + '</b>'
              + (has(a.sub) ? '<span>' + raw(a.sub) + '</span>' : '') + '</div>';
          }).join('') + '</div>');
    },

    /* Drawn from company, so contact details are written once. */
    contact: function (s, m) {
      var c = m.company || {};
      var row = function (k, v) {
        return has(v) ? '<div><dt>' + esc(k) + '</dt><dd>' + raw(v) + '</dd></div>' : '';
      };
      return headStack(s) + body('<div class="sl-d-contact">'
        + '<dl>' + row('Registered name', c.regName) + row('Registration', c.reg)
        + row('VAT', c.vat) + row('Address', c.address)
        + row('Website', c.website) + row('Email', c.email) + '</dl>'
        + '<div class="sl-d-who"><b>' + raw(c.contactName) + '</b>'
        + '<span>' + raw(c.contactRole) + '</span>'
        + (has(c.contactEmail) ? '<a href="mailto:' + esc(c.contactEmail) + '">' + raw(c.contactEmail) + '</a>' : '')
        + (has(c.contactPhone) ? '<a href="tel:' + esc(String(c.contactPhone).replace(/[^+\d]/g, '')) + '">' + raw(c.contactPhone) + '</a>' : '')
        + '</div></div>');
    }
  };

  /* Slides that carry their own colour. They are never counted into the
     alternation, so removing one cannot flip every band after it. */
  var OWN_BAND = { cover: 1, statement: 1, cta: 1 };

  /* ------------------------------------------------------- selection

     One place decides what is in a render. The picker, the Export
     button and make-pdf.py --only all come through here, so a deck
     of three sections is the same three sections whoever asked.

       opts.only    array of section keys, or null for all
       opts.slides  { sectionKey: [slide indices] }, or absent for all
       opts.onePager  keep only sections marked onePager            */

  function select(m, opts) {
    opts = opts || {};
    var only = opts.only && opts.only.length ? opts.only : null;
    var pick = opts.slides || {};
    return arr(m.sections).filter(function (sec) {
      if (only && only.indexOf(sec.k) < 0) return false;
      if (opts.onePager && !sec.onePager) return false;
      return true;
    }).map(function (sec) {
      var keep = pick[sec.k];
      var slides = arr(sec.slides).filter(function (s, i) {
        return !keep || keep.indexOf(i) > -1;
      });
      return { sec: sec, slides: slides };
    }).filter(function (g) {
      /* A ticked section with nothing ticked under it would print a
         heading above an empty page. */
      return g.slides.length > 0;
    });
  }

  /* --------------------------------------------------------- the deck */

  function slideHtml(s, m, state, onWhite) {
    var fn = SLIDES[s.type];
    if (!fn) return '';
    var own = OWN_BAND[s.type];
    var cls = 'sl-d-slide sl-d-slide--' + s.type;
    if (!own) { cls += ' sl-d-slide--b' + (state.band % 2); state.band++; }
    /* The cover's photograph is brand, not style, so it is handed to the
       stylesheet as a variable rather than written into it. */
    var style = (s.type === 'cover' && brand().cover && !onWhite)
      ? ' style="--cover-photo:url(' + brand().cover + ')"' : '';
    state.page++;
    var meta = m.meta || {};
    var foot = s.type === 'cover' ? ''
      : '<footer class="sl-d-foot">'
        + '<span>' + raw(meta.title || '') + (has(meta.client) ? ' &middot; ' + raw(meta.client) : '') + '</span>'
        + '<span class="sl-d-pageno">' + state.page + '</span>'
        + mark(!!own && !onWhite) + '</footer>';
    return '<section class="' + cls + '"' + style + '>' + fn(s, m, onWhite) + foot + '</section>';
  }

  /* The body of a deck: a tab per section, then its slides. The tabs are
     hidden on screen furniture rules and shown in the one-pager, where a
     reader needs to know which part they are looking at. */
  function deckHtml(m, opts) {
    var state = { band: 0, page: 0 };
    /* The one-pager is one voice on white, so the dark slides lose their
       colour there. A white lockup on white paper is an empty space, and
       a CSS rule cannot recolour an SVG for WeasyPrint, so the choice is
       made here instead. */
    var onWhite = !!(opts && opts.onePager);
    return '<div class="sl-d-deck">' + select(m, opts).map(function (g) {
      /* The tab carries the type of the slide it introduces, so a sheet
         can drop the ones that name themselves without a :has() selector
         that WeasyPrint may not have. */
      var first = (g.slides[0] || {}).type || 'none';
      return '<div class="sl-d-sec sl-d-sec--' + first + '"><b>' + raw(g.sec.n) + '</b><span></span></div>'
        + g.slides.map(function (s) { return slideHtml(s, m, state, onWhite); }).join('');
    }).join('') + '</div>';
  }

  /* --------------------------------------------------------- the CSS */

  function tokensCss(b) {
    var t = (b || brand()).tokens || {};
    return ':root{' + Object.keys(t).map(function (k) {
      return '--' + k + ':' + t[k];
    }).join(';') + '}';
  }

  /* The brand fonts as data, so a deck opened from an attachment and a
     deck printed by WeasyPrint are set in the same face. One declaration
     per real file at its real weight: a range like `100 900` is rejected
     outright by WeasyPrint, which then silently sets the whole deck in a
     fallback, and a synthesized 900 on a 3em heading is obvious. */
  function fontsCss() {
    var d = root.SL_DECK_ASSETS, a = assets(), out = '';
    var face = function (family, weight, b64) {
      return '@font-face{font-family:"' + family + '";font-style:normal;'
        + 'font-weight:' + weight + ';font-display:swap;'
        + 'src:url(data:font/woff2;base64,' + b64 + ') format("woff2")}';
    };
    if (d) {
      if (d.body400) out += face('Hanken Grotesk', 400, d.body400);
      if (d.body500) out += face('Hanken Grotesk', 500, d.body500);
      if (d.body700) out += face('Hanken Grotesk', 700, d.body700);
      if (d.body800) out += face('Hanken Grotesk', 800, d.body800);
      if (d.body900) out += face('Hanken Grotesk', 900, d.body900);
      if (d.mono400) out += face('JetBrains Mono', 400, d.mono400);
      return out;
    }
    /* Without deck-assets.js, the document builder's single 400 face is
       better than nothing. Declared at its own weight, never as a range. */
    if (a.fontBody) out += face('Hanken Grotesk', 400, a.fontBody);
    if (a.fontMono) out += face('JetBrains Mono', 400, a.fontMono);
    return out;
  }

  function styles(mode) {
    var c = css();
    var out = fontsCss() + tokensCss() + (c.core || '');
    if (mode === 'print')    out += c.print || '';
    else if (mode === 'one') out += c.onePager || '';
    else                     out += c.screen || '';
    return out;
  }

  /* ------------------------------------------------------- documents */

  function page(title, style, bodyHtml) {
    return '<!DOCTYPE html>\n<html lang="en-ZA">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
      + '<title>' + esc(title) + '</title>\n'
      + '<style>' + style + '</style>\n<\/head>\n<body>\n' + bodyHtml + '\n<\/body>\n<\/html>';
  }

  /* The deck as one file, to send. Carries its own fonts and styles and
     needs nothing beside it. */
  function standalone(m, opts) {
    var meta = m.meta || {};
    return page(meta.title || 'Deck', styles('screen'), deckHtml(m, opts));
  }

  /* What goes to WeasyPrint, and what the print dialog prints. */
  function printDoc(m, opts) {
    opts = opts || {};
    var meta = m.meta || {};
    return page(meta.title || 'Deck',
      styles(opts.onePager ? 'one' : 'print'),
      deckHtml(m, opts));
  }

  /* --------------------------------------------------- model check

     The house rules a renderer cannot fix for you, because the wording
     is the author's. Reported, never silently rewritten. */

  function titleCased(text) {
    var words = String(text).trim().split(/\s+/).filter(function (w) { return w.length > 3; });
    return words.length ? words.every(function (w) { return /^[A-Z[]/.test(w); }) : null;
  }

  function checkModel(m) {
    var out = [], todo = 0;
    var walk = function (where, text) {
      if (!has(text)) return;
      if (placeholder(text)) { todo++; return; }
      if (String(text).indexOf('\u2014') > -1)
        out.push({ rule: 'dash', where: where, detail: 'em dash in copy: ' + String(text).slice(0, 60) });
    };

    var covers = 0, ctas = 0, contacts = 0, statements = 0;

    /* The deck details and the company block carry copy too, and a deck
       sent with [ reference ] still on the cover is the mistake this
       count exists to catch. */
    Object.keys(m.meta || {}).forEach(function (k) { walk('meta.' + k, m.meta[k]); });
    Object.keys(m.company || {}).forEach(function (k) { walk('company.' + k, m.company[k]); });

    arr(m.sections).forEach(function (sec) {
      if (!has(sec.k)) out.push({ rule: 'section', where: sec.n || '?', detail: 'section has no key, so it cannot be selected' });
      if (!arr(sec.slides).length) out.push({ rule: 'empty', where: sec.k, detail: 'section has no slides' });

      arr(sec.slides).forEach(function (s, i) {
        var at = sec.k + '[' + i + '] ' + s.type;
        if (!SLIDES[s.type]) out.push({ rule: 'type', where: at, detail: 'unknown slide type' });

        if (s.type === 'cover')     covers++;
        if (s.type === 'cta')       ctas++;
        if (s.type === 'contact')   contacts++;
        if (s.type === 'statement') statements++;

        ['h', 'em', 'lead', 'text', 'body', 'note', 'cite', 'role'].forEach(function (k) { walk(at + '.' + k, s[k]); });
        arr(s.items).forEach(function (it, n) {
          if (typeof it === 'string') return walk(at + '.items[' + n + ']', it);
          ['title', 'body', 'k', 'v', 'when', 'note'].forEach(function (k) { walk(at + '.items[' + n + '].' + k, it[k]); });
          /* Five words or fewer is Title Case, past five is sentence case. */
          if (s.type === 'cards' && has(it.title) && !placeholder(it.title)) {
            var words = String(it.title).trim().split(/\s+/).length;
            var tc = titleCased(it.title);
            if (words <= 5 && tc === false)
              out.push({ rule: 'case', where: at + '.items[' + n + '].title', detail: 'five words or fewer, so Title Case: ' + it.title });
            if (words > 5 && tc === true)
              out.push({ rule: 'case', where: at + '.items[' + n + '].title', detail: 'past five words, so sentence case: ' + it.title });
          }
        });
        arr(s.kv).forEach(function (r, n) {
          walk(at + '.kv[' + n + '].k', r.k);
          walk(at + '.kv[' + n + '].v', r.v);
        });
        arr(s.rows).forEach(function (r, n) {
          arr(r).forEach(function (c, x) { walk(at + '.rows[' + n + '][' + x + ']', c); });
        });
        arr(s.actions).forEach(function (a, n) {
          walk(at + '.actions[' + n + '].label', a.label);
          walk(at + '.actions[' + n + '].sub', a.sub);
        });
        if (s.type === 'cover' && arr(s.kv).length > 4)
          out.push({ rule: 'ceiling', where: at, detail: 'more than four facts on the cover' });
      });
    });

    if (covers > 1)     out.push({ rule: 'ceiling', where: 'deck', detail: covers + ' covers, so one of them is not a cover' });
    if (ctas > 1)       out.push({ rule: 'ceiling', where: 'deck', detail: ctas + ' closing calls to action, which asks for nothing' });
    if (contacts > 1)   out.push({ rule: 'ceiling', where: 'deck', detail: contacts + ' contact slides' });
    if (statements > 1) out.push({ rule: 'ceiling', where: 'deck', detail: statements + ' statement bands, so neither stands out' });
    if (todo) out.push({ rule: 'todo', where: 'deck', detail: todo + ' fields are still placeholders' });

    return out;
  }

  /* ----------------------------------------------------------- export */

  root.SLDeck = {
    version: VERSION, model: MODEL,
    select: select, deckHtml: deckHtml,
    standalone: standalone, printDoc: printDoc,
    styles: styles, tokensCss: tokensCss, fontsCss: fontsCss,
    icon: icon, mark: mark, checkModel: checkModel,
    slideTypes: Object.keys(SLIDES)
  };
}());
</script>

'.sl-d-back[data-open="1"]{display:block}',

'.sl-d-pick[data-open="1"]{display:flex}',
'@media(min-width:720px){.sl-d-pick{inset:50% 0 auto;transform:translateY(-50%);',

'.sl-d-pick__head{display:flex;gap:12px;align-items:flex-start;padding:16px 18px 12px;',
' border-bottom:1px solid var(--border-hairline)}',
'.sl-d-pick__head h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:800}',

'.sl-d-pwrap[data-off="1"]{opacity:.42}',
'.sl-d-pick__bar{display:flex;gap:8px;align-items:center;padding:12px 18px;',
' border-top:1px solid var(--border-hairline);flex-wrap:wrap}',
'.sl-d-pick__bar .sl-d-gap{flex:1 1 auto}',
'.sl-d-link{font:inherit;font-size:12px;background:none;border:0;cursor:pointer;',
' color:var(--color-orange-text);text-decoration:underline;padding:4px}',
'.sl-d-st{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}'
  ].join('\n');

  function injectCss() {
    if (document.getElementById('sl-deck-edit-css')) return;
    var s = document.createElement('style');
    s.id = 'sl-deck-edit-css';
    s.textContent = D().fontsCss() + D().tokensCss()
      + (window.SL_DECK_CSS.core || '') + (window.SL_DECK_CSS.screen || '') + CSS;
    document.head.appendChild(s);
  }

  /* ------------------------------------------------------- the element */

  var Deck = function () { return Reflect.construct(HTMLElement, [], Deck); };
  Deck.prototype = Object.create(HTMLElement.prototype);
  Deck.prototype.constructor = Deck;
  Object.setPrototypeOf(Deck, HTMLElement);

  Deck.prototype.connectedCallback = function () {
    if (this.ready) return;
    this.ready = true;
    this.key = this.getAttribute('storage-key') || 'sl-deck-current';
    /* `view` is the hosted deck: the reader gets the deck and the download
       picker, and none of the editor. It is one attribute rather than a
       second page, so a shared deck cannot drift from the one you edit. */
    this.view = this.hasAttribute('view');
    this.open = null;                 /* which row's form is showing */
    this.load();
    injectCss();
    this.buildChrome();
    this.draw();
  };

  Deck.prototype.load = function () {
    var fresh = clone(window.SL_DECK_TEMPLATE);
    /* A reader gets the deck as published. Picking up whatever happens to
       be in their browser would be somebody else's draft. */
    if (this.view) { this.model = fresh; return; }
    try {
      var s = localStorage.getItem(this.key);
      var m = s ? JSON.parse(s) : null;
      /* A model from an older version of the template is still the
         author's copy, so it is kept and not replaced. */
      this.model = (m && arr(m.sections).length) ? m : fresh;
    } catch (e) { this.model = fresh; }
  };

  Deck.prototype.save = function () {
    if (this.view) return;
    try { localStorage.setItem(this.key, JSON.stringify(this.model)); } catch (e) {}
  };

  Deck.prototype.buildChrome = function () {
    var self = this;
    var mark = (window.SL_DECK_BRAND || {}).mark || '';

    this.deck = el('<main class="sl-d-host"></main>');
    this.panel = el('<aside class="sl-d-edit" aria-label="Edit the deck">'
      + '<div class="sl-d-edit__bar">' + mark
      + '<span class="sl-d-edit__v">v' + VERSION + '/' + D().version + '</span>'
      + '<button class="sl-d-btn" data-a="close">Close</button>'
      + '</div>'
      + '<div class="sl-d-edit__bar">'
      + '<button class="sl-d-btn" data-a="save">Save file</button>'
      + '<button class="sl-d-btn" data-a="open">Open file</button>'
      + '<button class="sl-d-btn" data-a="export">Export</button>'
      + '<button class="sl-d-btn" data-a="check">Check</button>'
      + '<button class="sl-d-btn" data-a="reset">Reset</button>'
      + '</div>'
      + '<div class="sl-d-edit__body"></div></aside>');
    this.body = this.panel.querySelector('.sl-d-edit__body');

    this.opener = el('<button class="sl-d-btn sl-d-btn--go sl-d-opener" data-a="opener">Edit copy</button>');
    this.file = el('<input type="file" accept="application/json,.json" hidden>');

    this.back = el('<div class="sl-d-back"></div>');
    this.pick = el('<div class="sl-d-pick" role="dialog" aria-modal="true" aria-label="What goes in the PDF"></div>');

    if (this.view) {
      /* The deck, the bar and the picker. No panel, no opener, no file
         input: there is nothing here for a reader to edit. */
      this.append(this.deck, this.back, this.pick);
    } else {
      this.append(this.deck, this.panel, this.opener, this.file, this.back, this.pick);
      this.opener.addEventListener('click', function () { self.setOpen(true); });
    }
    if (!this.view) {
      this.panel.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a]');
        if (b) { e.preventDefault(); self.act(b.getAttribute('data-a'), b); }
      });
      this.panel.addEventListener('input', function (e) { self.field(e.target, false); });
      this.panel.addEventListener('change', function (e) {
        if (e.target.matches('select,[type=checkbox],[type=number]')) self.field(e.target, true);
      });
      this.file.addEventListener('change', function () { self.readFile(); });
    }
    this.back.addEventListener('click', function () { self.closePicker(); });
    this.pick.addEventListener('click', function (e) {
      var b = e.target.closest('[data-p]');
      if (b) { e.preventDefault(); self.pickAct(b.getAttribute('data-p')); }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { self.closePicker(); }
    });
  };

  Deck.prototype.setOpen = function (v) {
    this.panel.setAttribute('data-open', v ? '1' : '0');
    this.opener.hidden = !!v;
  };

  /* ----------------------------------------------------------- drawing */

  Deck.prototype.draw = function () {
    this.redrawDeck();
    if (!this.view) { this.drawPanel(); this.save(); }
  };

  Deck.prototype.redrawDeck = function () {
    this.deck.innerHTML = this.bar() + D().deckHtml(this.model, null);
    var self = this;
    var dl = this.deck.querySelector('[data-a="download"]');
    if (dl) dl.addEventListener('click', function () { self.openPicker(); });
  };

  Deck.prototype.bar = function () {
    var m = this.model, meta = m.meta || {};
    var n = arr(m.sections).reduce(function (t, s) { return t + arr(s.slides).length; }, 0);
    return '<div class="sl-d-bar">' + ((window.SL_DECK_BRAND || {}).mark || '')
      + '<span class="sl-d-count">' + esc(meta.client || meta.subtitle || '') + '</span>'
      + '<span class="sl-d-bar__gap"></span>'
      + '<span class="sl-d-count">' + n + ' slides</span>'
      + '<button class="sl-d-btn sl-d-btn--go" data-a="download">Download PDF</button></div>';
  };

  Deck.prototype.drawPanel = function () {
    var self = this, m = this.model, out = [];
    out.push(this.rowHtml('meta', 'Deck details', 'meta'));
    out.push(this.rowHtml('company', 'Company and contact', 'company'));

    arr(m.sections).forEach(function (sec, si) {
      out.push('<div class="sl-d-row sl-d-row--sec"><b>' + esc(sec.n || sec.k) + '</b>'
        + '<em>' + esc(sec.k) + '</em>'
        + '<button data-a="editsec" data-i="' + si + '" title="Edit the section">Edit</button>'
        + '<button data-a="secup" data-i="' + si + '" title="Move up">&uarr;</button>'
        + '<button data-a="secdown" data-i="' + si + '" title="Move down">&darr;</button>'
        + '<button data-a="secdel" data-i="' + si + '" title="Delete the section">&times;</button></div>');
      if (self.open === 'sec' + si) out.push(self.form());

      arr(sec.slides).forEach(function (s, i) {
        out.push('<div class="sl-d-row"><b>' + esc((FIELDS[s.type] || {}).label || s.type) + '</b>'
          + '<button data-a="edit" data-i="' + si + '.' + i + '">Edit</button>'
          + '<button data-a="up" data-i="' + si + '.' + i + '">&uarr;</button>'
          + '<button data-a="down" data-i="' + si + '.' + i + '">&darr;</button>'
          + '<button data-a="del" data-i="' + si + '.' + i + '">&times;</button></div>');
        if (self.open === si + '.' + i) out.push(self.form());
      });

      out.push('<div class="sl-d-row"><em>Add a slide here</em>'
        + '<select data-a="addsel" data-i="' + si + '">'
        + Object.keys(FIELDS).map(function (k) {
            return '<option value="' + k + '">' + esc(FIELDS[k].label) + '</option>';
          }).join('') + '</select>'
        + '<button data-a="add" data-i="' + si + '">Add</button></div>');
    });

    out.push('<div class="sl-d-row sl-d-row--sec"><b>Add a section</b>'
      + '<button data-a="addsec">Add</button></div>');
    out.push('<p class="sl-d-note">Autosaved in this browser. Save file keeps a copy you can open anywhere.</p>');
    this.body.innerHTML = out.join('');
    if (this.lastOut) this.body.insertAdjacentHTML('beforeend', '<pre class="sl-d-out">' + esc(this.lastOut) + '</pre>');
  };

  Deck.prototype.rowHtml = function (id, label, kind) {
    return '<div class="sl-d-row"><b>' + esc(label) + '</b>'
      + '<button data-a="edit" data-i="' + id + '">Edit</button></div>'
      + (this.open === id ? this.form() : '');
  };

  function input(kind, path, value, label) {
    var p = esc(path), v = value == null ? '' : value;
    if (kind === 'check')
      return '<label class="sl-d-f sl-d-f--check"><input type="checkbox" data-p="' + p + '"'
        + (v ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
    if (kind === 'area')
      return '<label class="sl-d-f"><span>' + esc(label) + '</span>'
        + '<textarea data-p="' + p + '">' + esc(v) + '</textarea></label>';
    if (kind === 'num')
      return '<label class="sl-d-f"><span>' + esc(label) + '</span>'
        + '<input type="number" data-p="' + p + '" value="' + esc(v) + '"></label>';
    if (kind === 'icon') {
      var set = Object.keys((((window.SL_DECK_ASSETS || window.SL_DOC_ASSETS) || {}).icons) || {});
      return '<label class="sl-d-f"><span>' + esc(label) + '</span><select data-p="' + p + '">'
        + set.map(function (n) {
            return '<option value="' + n + '"' + (n === v ? ' selected' : '') + '>' + n + '</option>';
          }).join('') + '</select></label>';
    }
    return '<label class="sl-d-f"><span>' + esc(label) + '</span>'
      + '<input type="text" data-p="' + p + '" value="' + esc(v) + '"></label>';
  }

  Deck.prototype.form = function () {
    var m = this.model, id = this.open, html = '';

    if (id === 'meta')
      html = META.map(function (f) { return input(f[1], 'meta.' + f[0], (m.meta || {})[f[0]], f[2]); }).join('');

    else if (id === 'company')
      html = COMPANY.map(function (f) { return input(f[1], 'company.' + f[0], (m.company || {})[f[0]], f[2]); }).join('');

    else if (id.indexOf('sec') === 0) {
      var si = Number(id.slice(3)), sec = m.sections[si];
      html = SECTION.map(function (f) {
        return input(f[1], 'sections.' + si + '.' + f[0], sec[f[0]], f[2]);
      }).join('')
      + input('text', 'sections.' + si + '.k', sec.k, 'Key, used by the picker and by --only');
    }

    else {
      var parts = id.split('.'), x = Number(parts[0]), y = Number(parts[1]);
      var s = m.sections[x].slides[y];
      var spec = FIELDS[s.type] || { head: [] };
      var base = 'sections.' + x + '.slides.' + y + '.';

      html = (spec.head || []).map(function (f) {
        return input(f[1], base + f[0], s[f[0]], f[2]);
      }).join('');

      if (spec.rows) {
        html += '<div class="sl-d-sub"><h4>The table</h4>'
          + input('text', base + '_head', arr(s.head).join(' | '), 'Header cells, divided by |')
          + input('area', base + '_rows', arr(s.rows).map(function (r) { return arr(r).join(' | '); }).join('\n'),
                  'Rows, one to a line, cells divided by |')
          + '</div>';
      }

      var L = spec.list;
      if (L) {
        html += '<div class="sl-d-sub"><h4>' + esc(L.label) + '</h4>';
        arr(s[L.key]).forEach(function (it, n) {
          if (L.kind === 'string') {
            html += input(L.field || 'text', base + L.key + '.' + n, it, 'Line ' + (n + 1));
          } else {
            L.cols.forEach(function (c) {
              html += input(c[1], base + L.key + '.' + n + '.' + c[0], it[c[0]], c[2] + ' ' + (n + 1));
            });
          }
          html += '<div class="sl-d-row"><em>' + (n + 1) + '</em>'
            + '<button data-a="itemdel" data-i="' + id + '.' + L.key + '.' + n + '">Remove</button></div>';
        });
        html += '<div class="sl-d-row"><em>Add</em>'
          + '<button data-a="itemadd" data-i="' + id + '.' + L.key + '">Add one</button></div></div>';
      }
    }

    return '<div class="sl-d-form">' + html + '</div>';
  };

  /* ----------------------------------------------------------- editing */

  Deck.prototype.field = function (t, structural) {
    var path = t.getAttribute('data-p');
    if (!path) return;
    var v = t.type === 'checkbox' ? t.checked
          : t.type === 'number'   ? Number(t.value)
          : t.value;

    /* The two synthetic fields: a table edited as text. */
    if (/\._head$/.test(path) || /\._rows$/.test(path)) {
      var at = path.replace(/\._(head|rows)$/, '');
      if (/_head$/.test(path)) setPath(this.model, at + '.head', String(v).split('|').map(function (c) { return c.trim(); }));
      else setPath(this.model, at + '.rows', String(v).split('\n').filter(function (l) { return l.trim() !== ''; })
             .map(function (l) { return l.split('|').map(function (c) { return c.trim(); }); }));
    } else {
      setPath(this.model, path, v);
    }

    this.redrawDeck();
    this.save();
    if (structural) this.drawPanel();
  };

  function blank(type) {
    var spec = FIELDS[type] || {};
    var s = { type: type };
    (spec.head || []).forEach(function (f) { s[f[0]] = f[1] === 'check' ? false : ''; });
    if (spec.rows) { s.head = ['', '', '']; s.rows = [['', '', '']]; }
    if (spec.list) s[spec.list.key] = [blankItem(spec.list)];
    return s;
  }
  function blankItem(L) {
    if (L.kind === 'string') return '';
    var o = {};
    L.cols.forEach(function (c) { o[c[0]] = ''; });
    return o;
  }

  Deck.prototype.act = function (a, btn) {
    var m = this.model, i = btn && btn.getAttribute('data-i');

    if (a === 'opener') return this.setOpen(true);
    if (a === 'close')  return this.setOpen(false);

    if (a === 'edit')    { this.open = (this.open === i) ? null : i; return this.drawPanel(); }
    if (a === 'editsec') { var k = 'sec' + i; this.open = (this.open === k) ? null : k; return this.drawPanel(); }

    if (a === 'up' || a === 'down' || a === 'del') {
      var p = i.split('.'), si = Number(p[0]), n = Number(p[1]);
      var list = m.sections[si].slides;
      if (a === 'del') list.splice(n, 1);
      else {
        var to = a === 'up' ? n - 1 : n + 1;
        if (to < 0 || to >= list.length) return;
        list.splice(to, 0, list.splice(n, 1)[0]);
      }
      this.open = null; return this.draw();
    }

    if (a === 'secup' || a === 'secdown' || a === 'secdel') {
      var x = Number(i);
      if (a === 'secdel') {
        if (!confirm('Delete the whole "' + (m.sections[x].n || m.sections[x].k) + '" section?')) return;
        m.sections.splice(x, 1);
      } else {
        var t2 = a === 'secup' ? x - 1 : x + 1;
        if (t2 < 0 || t2 >= m.sections.length) return;
        m.sections.splice(t2, 0, m.sections.splice(x, 1)[0]);
      }
      this.open = null; return this.draw();
    }

    if (a === 'add') {
      var sel = this.body.querySelector('select[data-a="addsel"][data-i="' + i + '"]');
      m.sections[Number(i)].slides.push(blank(sel ? sel.value : 'cards'));
      this.open = i + '.' + (m.sections[Number(i)].slides.length - 1);
      return this.draw();
    }

    if (a === 'addsec') {
      /* A key has to be unique, because it is what the picker and
         --only name. Numbered rather than guessed from the name. */
      var keys = m.sections.map(function (s) { return s.k; });
      var n2 = m.sections.length + 1, key = 'section' + n2;
      while (keys.indexOf(key) > -1) key = 'section' + (++n2);
      m.sections.push({ k: key, n: 'New section', d: 'What it is, as the picker shows it.',
                        onePager: false, slides: [blank('cards')] });
      this.open = 'sec' + (m.sections.length - 1);
      return this.draw();
    }

    if (a === 'itemadd' || a === 'itemdel') {
      var bits = i.split('.');
      var isSec = bits[0] === 'sec';
      if (isSec) return;
      var sx = Number(bits[0]), sy = Number(bits[1]), key = bits[2], idx = Number(bits[3]);
      var slide = m.sections[sx].slides[sy];
      var L = (FIELDS[slide.type] || {}).list;
      if (!L) return;
      if (!Array.isArray(slide[key])) slide[key] = [];
      if (a === 'itemadd') slide[key].push(blankItem(L));
      else slide[key].splice(idx, 1);
      return this.draw();
    }

    if (a === 'save')   return this.download(JSON.stringify(this.model, null, 1),
                          (this.model.meta.pdfName || 'deck') + '.json', 'application/json');
    if (a === 'export') return this.download(D().standalone(this.model, null),
                          (this.model.meta.pdfName || 'deck') + '.html', 'text/html');
    if (a === 'open')   return this.file.click();
    if (a === 'check')  return this.check();
    if (a === 'reset') {
      if (!confirm('Throw away this copy and start from the standard deck?')) return;
      this.model = clone(window.SL_DECK_TEMPLATE);
      this.open = null; this.lastOut = ''; return this.draw();
    }
  };

  Deck.prototype.download = function (text, name, mime) {
    var a = document.createElement('a');
    var blob = new Blob([text], { type: mime });
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  };

  Deck.prototype.readFile = function () {
    var self = this, f = this.file.files && this.file.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var m = JSON.parse(r.result);
        if (!arr(m.sections).length) throw new Error('no sections in that file');
        self.model = m; self.open = null; self.lastOut = ''; self.draw();
      } catch (e) { self.lastOut = 'Could not open that file.\n' + e.message; self.drawPanel(); }
    };
    r.readAsText(f);
    this.file.value = '';
  };

  Deck.prototype.check = function () {
    var fails = D().checkModel(this.model);
    this.lastOut = fails.length
      ? fails.map(function (x) { return x.rule + '  ' + x.where + '\n    ' + x.detail; }).join('\n')
      : 'Nothing to report. Band rhythm, ceilings and heading case all hold.';
    this.drawPanel();
  };

  /* ------------------------------------------------------- the picker

     The whole deck is fourteen pages and most of the time one part of
     it is what the reader asked for, so the button asks first. The keys
     come from the model's own sections and go straight to the renderer,
     which does the gating. No layout lives here, and make-pdf.py --only
     takes the same keys.                                             */

  Deck.prototype.openPicker = function () {
    var secs = arr(this.model.sections);
    this.pick.innerHTML = '<div class="sl-d-pick__head"><div>'
      + '<h3>What goes in the PDF?</h3>'
      + '<p>All of it runs to ' + secs.reduce(function (t, s) { return t + arr(s.slides).length; }, 0)
      + ' slides, so take only the parts they asked for.</p></div>'
      + '<button class="sl-d-btn" data-p="close" aria-label="Close">&times;</button></div>'
      + '<div class="sl-d-pick__body">'
      + secs.map(function (sec, i) {
          var multi = arr(sec.slides).length > 1;
          return '<div class="sl-d-pwrap" id="pw-' + i + '">'
            + '<label class="sl-d-ps"><input type="checkbox" data-sec="' + i + '" checked>'
            + '<span><b>' + esc(sec.n || sec.k) + '</b><em>' + esc(sec.d || '') + '</em></span></label>'
            + (multi ? '<details class="sl-d-psub"><summary>Choose which slides &middot; '
                + '<span id="pc-' + i + '"></span></summary>'
                + arr(sec.slides).map(function (s, n) {
                    return '<label><input type="checkbox" data-kid="' + i + '" value="' + n + '" checked>'
                      + '<span>' + esc((FIELDS[s.type] || {}).label || s.type)
                      + (s.h ? ' &middot; ' + esc(String(s.h).slice(0, 34)) : '') + '</span></label>';
                  }).join('')
                + '</details>' : '')
            + '</div>';
        }).join('')
      + '<label class="sl-d-ps"><input type="checkbox" id="pone">'
      + '<span><b>As a one-pager</b><em>A4 portrait and condensed, instead of one slide a page. '
      + 'Uses the sections marked for it.</em></span></label>'
      + '</div>'
      + '<div class="sl-d-pick__bar">'
      + '<button class="sl-d-link" data-p="all">Select all</button>'
      + '<button class="sl-d-link" data-p="none">Clear</button>'
      + '<span class="sl-d-gap"></span><span class="sl-d-st" id="pst"></span>'
      + '<button class="sl-d-btn sl-d-btn--go" data-p="go" id="pgo">Create the PDF</button></div>'
      /* On the hosted deck there is no render server, so the browser's own
         print engine does it. Say so before the dialog appears rather than
         letting it arrive unannounced. */
      + (this.view ? '<p class="sl-d-note" style="padding:0 18px 14px;margin:0">'
          + 'Your browser&rsquo;s print dialog opens next. Choose <b>Save as PDF</b> '
          + 'as the destination.</p>' : '');

    var self = this;
    this.pick.querySelectorAll('[data-sec],[data-kid],#pone').forEach(function (b) {
      b.addEventListener('change', function () {
        /* Ticking a section back on brings its slides with it, or the
           section would come back empty and print nothing. */
        if (b.hasAttribute('data-sec') && b.checked) {
          var kids = self.kids(b.getAttribute('data-sec'));
          if (kids.length && !kids.some(function (k) { return k.checked; }))
            kids.forEach(function (k) { k.checked = true; });
        }
        self.pickSync();
      });
    });
    this.pick.setAttribute('data-open', '1');
    this.back.setAttribute('data-open', '1');
    this.pickSync();
  };

  Deck.prototype.kids = function (i) {
    return Array.prototype.slice.call(this.pick.querySelectorAll('[data-kid="' + i + '"]'));
  };

  Deck.prototype.closePicker = function () {
    this.pick.setAttribute('data-open', '0');
    this.back.setAttribute('data-open', '0');
  };

  /* A section counts as live when it is ticked and something under it
     is too. Without this the PDF carries a heading and nothing else. */
  Deck.prototype.live = function () {
    var self = this, out = [];
    arr(this.model.sections).forEach(function (sec, i) {
      var box = self.pick.querySelector('[data-sec="' + i + '"]');
      if (!box || !box.checked) return;
      var kids = self.kids(i);
      var picked = kids.length
        ? kids.filter(function (k) { return k.checked; }).map(function (k) { return Number(k.value); })
        : null;
      if (kids.length && !picked.length) return;
      out.push({ k: sec.k, slides: picked });
    });
    return out;
  };

  Deck.prototype.pickSync = function () {
    var self = this;
    arr(this.model.sections).forEach(function (sec, i) {
      var kids = self.kids(i);
      if (!kids.length) return;
      var on = kids.filter(function (k) { return k.checked; }).length;
      var c = self.pick.querySelector('#pc-' + i);
      if (c) c.textContent = on === kids.length ? 'all ' + kids.length : on ? on + ' of ' + kids.length : 'none';
      var box = self.pick.querySelector('[data-sec="' + i + '"]');
      var w = self.pick.querySelector('#pw-' + i);
      if (w) w.setAttribute('data-off', box && box.checked ? '0' : '1');
    });
    var n = this.live().length;
    var go = this.pick.querySelector('#pgo');
    go.disabled = n === 0;
    go.textContent = n === 0 ? 'Pick at least one' : 'Create the PDF';
  };

  Deck.prototype.pickAct = function (a) {
    var self = this;
    if (a === 'close') return this.closePicker();
    if (a === 'all' || a === 'none') {
      var v = a === 'all';
      this.pick.querySelectorAll('[data-sec],[data-kid]').forEach(function (b) { b.checked = v; });
      return this.pickSync();
    }
    if (a === 'go') return this.makePdf();
  };

  Deck.prototype.opts = function () {
    var live = this.live(), slides = {};
    live.forEach(function (s) { if (s.slides) slides[s.k] = s.slides; });
    return {
      only: live.map(function (s) { return s.k; }),
      slides: slides,
      onePager: !!this.pick.querySelector('#pone').checked
    };
  };

  Deck.prototype.st = function (text) {
    var s = this.pick.querySelector('#pst');
    if (s) s.textContent = text || '';
  };

  /* WeasyPrint cannot run in a browser: the LearnIQ planner proved that
     at length, and no amount of self-hosting fixes it. So the exact PDF
     comes from serve.py, and with no server the browser's own print
     engine is the fall back, which still produces a PDF through Save as
     PDF and is the only thing that works from an attachment. */
  Deck.prototype.makePdf = function () {
    var self = this, opts = this.opts();
    var name = (this.model.meta.pdfName || 'Sunlogic-Pitch')
      + (opts.onePager ? '-one-pager' : '')
      + (opts.only.length === arr(this.model.sections).length ? '' : '-' + opts.only.join('-'));
    var go = this.pick.querySelector('#pgo');
    go.disabled = true;
    this.st('rendering');

    fetch('/pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: this.model, opts: opts, name: name })
    }).then(function (r) {
      if (!r.ok) return r.json().then(function (j) { throw new Error(j.error || r.status); });
      return r.blob();
    }).then(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name + '.pdf';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      self.st('saved');
      setTimeout(function () { self.closePicker(); self.st(''); go.disabled = false; }, 900);
    }).catch(function (err) {
      console.info('No render server, printing instead.', err.message);
      self.printFallback(opts);
      self.st('print dialog');
      go.disabled = false;
    });
  };

  Deck.prototype.printFallback = function (opts) {
    var html = D().printDoc(this.model, opts);
    var w = window.open('', '_blank');
    if (!w) { this.download(html, 'deck.html', 'text/html'); return; }
    w.document.open(); w.document.write(html); w.document.close();
    /* Give the fonts a moment, or the first page prints in a fallback face. */
    setTimeout(function () { try { w.focus(); w.print(); } catch (e) {} }, 700);
  };

  if (!window.customElements.get('plugin-pitch-deck'))
    window.customElements.define('plugin-pitch-deck', Deck);
}());
</script>
</body>
</html>
